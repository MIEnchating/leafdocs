# Render Blueprint: web service + PostgreSQL + persistent image storage.
services:
  - type: web
    name: new-api-docs
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:production
    initialDeployHook: npm run db:seed
    healthCheckPath: /login
    autoDeployTrigger: commit
    disk:
      name: uploads
      mountPath: /opt/render/project/src/.data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: new-api-docs-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: new-api-docs-db
    plan: basic-256mb
    region: singapore
    databaseName: new_api_docs
    user: docs
    ipAllowList: []
